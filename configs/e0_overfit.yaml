# Sanity check: memorize 10 training images. Pass = pixel accuracy >= 0.95 on those images.
# (mIoU is not the criterion: unweighted CE never predicts classes with only a few hundred
#  pixels even on memorized images -- see results/decisions.json and the paper.)
base: base.yaml
data: {img_size: 384, subset: 10, val_on_train: true}
augment: {enabled: false}
train: {epochs: 200, batch_size: 2, warmup_steps: 0, eval_every: 25}
